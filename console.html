<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E9ECEF">
<title>Build Console — 100 miles</title>

<!-- ============================================================
     Renders ultra-console.jsx (the training console) with no build
     step, matching the rest of this repo: React + Babel are vendored
     in /vendor and the JSX is compiled in the browser on load.
     - Serve this folder over HTTP (e.g. `python3 -m http.server`),
       then open /console.html — fetch() can't read the .jsx from a
       file:// URL.
     - Progress you check off here saves to this browser's
       localStorage. The shared, permanent record is the COMPLETED
       constant inside ultra-console.jsx.
     ============================================================ -->

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<style>body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script>
/* The component was written against the claude.ai artifact storage
   API (async window.storage.get/set). Back it with localStorage so
   checkmarks and the daily log persist in this browser. */
window.storage = {
  get: async (k) => ({ value: localStorage.getItem(k) }),
  set: async (k, v) => { localStorage.setItem(k, v); },
};

Promise.all([
  fetch("./training-data.json").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  fetch("./ultra-console.jsx").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }),
])
  .then(([data, src]) => {
    /* The component reads the plan from window.TRAINING_DATA — the same
       training-data.json that feeds index.html's live-training block. */
    window.TRAINING_DATA = data;
    /* Strip the module syntax so the file runs as a plain script;
       everything else is untouched. */
    var { useState, useEffect, useMemo, useRef } = React;
    src = src
      .replace(/^import\s.*$/m, "")
      .replace("export default function UltraConsole", "function UltraConsole");
    eval(Babel.transform(src, { presets: ["react"] }).code);
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(UltraConsole));
  })
  .catch((e) => {
    document.getElementById("root").innerHTML =
      '<div style="font-family:monospace;padding:2rem;max-width:60ch">' +
      "<p><b>Could not load the console files</b> (" + e + ").</p>" +
      "<p>Serve this folder over HTTP instead of opening the file directly — " +
      "for example run <code>python3 -m http.server</code> here, then visit " +
      "<code>http://localhost:8000/console.html</code>.</p></div>";
  });
</script>
</body>
</html>
