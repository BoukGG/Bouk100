  <path d="M 61.9 24.9 A 28 28 0 1 1 38.1 24.9" fill="none" stroke="#F4F3F0" stroke-width="11"/>
  <rect x="43.5" y="18" width="13" height="7" rx="1.5" fill="#F4F3F0"/>
  <circle cx="50" cy="50" r="8.5" fill="#F4F3F0"/>
</svg>
