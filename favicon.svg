<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Both Clocks — favicon / app tile. White micro-mark on a carbon
       rounded square so it reads on light and dark browser chrome.
       Inner ring compresses to a solid dot at micro sizes. -->
